name = "caoscorp-iptv-pairing"
main = "src/index.js"
compatibility_date = "2026-10-27"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[durable_objects.bindings]]
name = "PAIRING_SESSIONS"
class_name = "PairingSession"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PairingSession"]
