<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex,nofollow">
  <title>Conectar CAOSCORP IPTV</title>
  <style>
    :root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif;background:#070a12;color:#fff}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;box-sizing:border-box}
    main{width:min(100%,440px);background:#111827;border:1px solid #263244;border-radius:20px;padding:24px;box-sizing:border-box}
    h1{font-size:1.45rem;margin:0 0 8px}p{color:#a5b0c3;line-height:1.5}
    label{display:block;margin:16px 0 6px;font-size:.9rem}
    input{width:100%;box-sizing:border-box;background:#070a12;border:1px solid #435066;border-radius:10px;padding:12px;color:#fff;font:inherit}
    button{width:100%;margin-top:20px;padding:13px;border:0;border-radius:10px;background:#64d9e8;color:#061017;font-weight:700;font:inherit}
    button:disabled{opacity:.5}#status{margin-top:16px;white-space:pre-wrap}
    .note{font-size:.82rem}
  </style>
</head>
<body>
<main>
  <h1>Conectar CAOSCORP IPTV</h1>
  <p>Introduce los datos Xtream de tu proveedor. Se cifran en este teléfono antes de enviarse al televisor emparejado.</p>
  <form id="form">
    <label for="server">Servidor (URL)</label><input id="server" name="server" type="url" autocomplete="url" placeholder="https://servidor.example:8080" required>
    <label for="username">Usuario</label><input id="username" name="username" autocomplete="username" required maxlength="256">
    <label for="password">Contraseña</label><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="512">
    <button id="submit" type="submit">Enviar al televisor</button>
  </form>
  <p id="status" role="status" aria-live="polite"></p>
  <p class="note">El QR caduca en cinco minutos y solo puede utilizarse una vez. No cierres esta página hasta recibir la confirmación.</p>
</main>
<script>
(() => {
  const status = document.getElementById("status");
  const button = document.getElementById("submit");
  const params = new URLSearchParams(location.hash.slice(1));
  const sessionId = params.get("session");
  const phoneToken = params.get("token");
  history.replaceState(null, "", location.pathname);
  if (!sessionId || !phoneToken || !/^[0-9a-f-]{36}$/i.test(sessionId)) {
    document.getElementById("form").hidden = true;
    status.textContent = "El enlace de emparejamiento no es válido. Regresa al televisor y genera un QR nuevo.";
    return;
  }
  const api = "/api/session/" + encodeURIComponent(sessionId);
  document.getElementById("form").addEventListener("submit", async (event) => {
    event.preventDefault();
    if (!window.isSecureContext || !crypto.subtle) {
      status.textContent = "Este navegador no permite el cifrado seguro requerido.";
      return;
    }
    button.disabled = true;
    status.textContent = "Cifrando y enviando al televisor…";
    try {
      const keyResponse = await fetch(api + "/public-key", {cache:"no-store", credentials:"omit"});
      if (!keyResponse.ok) throw new Error("El QR caducó o la sesión ya no existe.");
      const {publicKeyJwk} = await keyResponse.json();
      const publicKey = await crypto.subtle.importKey("jwk", publicKeyJwk, {name:"RSA-OAEP",hash:"SHA-256"}, false, ["encrypt"]);
      const payload = JSON.stringify({
        server: document.getElementById("server").value.trim(),
        username: document.getElementById("username").value.trim(),
        password: document.getElementById("password").value
      });
      const aesKey = await crypto.subtle.generateKey({name:"AES-GCM",length:256}, true, ["encrypt"]);
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const encryptedData = await crypto.subtle.encrypt({name:"AES-GCM",iv}, aesKey, new TextEncoder().encode(payload));
      const rawAesKey = await crypto.subtle.exportKey("raw", aesKey);
      const wrappedKey = await crypto.subtle.encrypt({name:"RSA-OAEP"}, publicKey, rawAesKey);
      const toBase64 = (value) => btoa(String.fromCharCode(...new Uint8Array(value)));
      const ciphertext = JSON.stringify({
        wrappedKey: toBase64(wrappedKey),
        iv: toBase64(iv),
        data: toBase64(encryptedData)
      });
      const response = await fetch(api + "/submit", {
        method:"POST", credentials:"omit", cache:"no-store",
        headers:{"content-type":"application/json","authorization":"Bearer " + phoneToken},
        body:JSON.stringify({ciphertext})
      });
      if (!response.ok) {
        const result = await response.json().catch(() => ({}));
        throw new Error(result.error === "session_expired" ? "El QR caducó. Genera uno nuevo en el televisor." : "No se pudieron enviar los datos. Genera un QR nuevo e inténtalo otra vez.");
      }
      document.getElementById("password").value = "";
      status.textContent = "Datos cifrados enviados. Confirma el resultado de conexión en tu televisor.";
      document.getElementById("form").hidden = true;
    } catch (error) {
      status.textContent = error instanceof Error ? error.message : "No se pudo completar el envío.";
      button.disabled = false;
    }
  });
})();
</script>
</body>
</html>
