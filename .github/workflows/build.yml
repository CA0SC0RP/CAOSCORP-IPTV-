name: Compilar APK (rama android-nativo)

on:
  push:
    branches: [android-nativo]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Imagen fija que ya trae el SDK de Android instalado.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compilar APK (debug)
        run: gradle :app:assembleDebug --stacktrace

      - name: Poner nombre fijo al APK
        run: cp app/build/outputs/apk/debug/app-debug.apk CAOS-LAB.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CAOS-LAB-apk
          path: CAOS-LAB.apk

      # Etiqueta propia ("lab") para no pisar la versión web ni la etiqueta "latest".
      - name: Mover la etiqueta "lab" a este commit
        run: |
          git tag -f lab
          git push -f origin lab

      - name: Publicar en Releases (enlace fijo)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lab
          name: "CAOS Lab (build ${{ github.run_number }})"
          prerelease: true
          files: CAOS-LAB.apk
          body: "APK de debug de la rama android-nativo, commit ${{ github.sha }}."
